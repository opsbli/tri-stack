<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>智引快检结论卡 — {{brand}}</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f7f5;color:#2c2c2a;margin:0;padding:24px}
  .card{max-width:560px;margin:0 auto;background:#fff;border:1px solid #e3e2dd;border-radius:12px;padding:24px}
  h1{font-size:18px;font-weight:500;margin:0 0 12px}
  .score{font-size:40px;font-weight:500;color:#0f6e56}
  .rating{font-size:14px;color:#0f6e56;margin-left:8px}
  .meta{color:#5f5e5a;font-size:12px;line-height:1.8;margin-top:8px}
  h2{font-size:14px;font-weight:500;margin:20px 0 8px}
  ol{margin:0;padding-left:20px;font-size:13px;line-height:1.9}
  table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}
  th,td{border:1px solid #e3e2dd;padding:6px 8px;text-align:left}
  th{background:#f1efe8;font-weight:500}
  .foot{margin-top:16px;font-size:11px;color:#888780;border-top:1px solid #e3e2dd;padding-top:10px}
</style>
</head>
<body>
<div class="card">
  <h1>智引快检结论卡 — {{brand}}</h1>
  <div><span class="score">{{total}}</span><span class="rating">/100 · {{rating}}</span></div>
  <div class="meta">日期：{{date}} ｜ 模式：{{mode}}<br>证据：{{evidence_path}}</div>

  <h2>维度速览</h2>
  <table>
    <tr><th>维度</th><th>得分</th><th>产出脚本</th></tr>
    {{#pillars}}
    <tr><td>{{name}}</td><td>{{score}}</td><td>{{tool}}</td></tr>
    {{/pillars}}
  </table>

  <h2>Top3 修复项</h2>
  <ol>
    {{#fixes}}
    <li>[{{priority}}] {{item}}</li>
    {{/fixes}}
  </ol>

  <div class="foot">分数由确定性脚本产出并附证据路径；实测类指标标注采样轮数与波动区间。</div>
</div>
</body>
</html>
